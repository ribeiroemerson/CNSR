# Blueprint do Render (Infrastructure as Code) para deploy contínuo a partir do GitHub.
#
# Este arquivo precisa ficar na RAIZ do repositório Git para o Render conseguir
# detectá-lo automaticamente ao criar um Blueprint. O código do backend está na
# subpasta "CNSR/backend" (ver "rootDir" abaixo), por isso os comandos de build/start
# rodam relativos a essa pasta.
#
# Como usar:
#   1. Confirme que este arquivo está commitado na branch "main" do GitHub.
#   2. No painel do Render, clique em "New +" > "Blueprint" e selecione o repositório.
#   3. Revise os recursos detectados (banco + serviço web) e confirme em "Apply".
#   4. O Render injeta DATABASE_URL (a partir do banco) e gera um JWT_SECRET
#      automaticamente — nenhuma credencial fica exposta no repositório.
#   5. Cada novo push na branch configurada dispara um novo deploy (deploy contínuo).

databases:
  - name: cnsr-db
    plan: free
    databaseName: cnsr
    user: cnsr

services:
  - type: web
    name: cnsr-backend
    runtime: node
    plan: free
    branch: main
    rootDir: CNSR/backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cnsr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
