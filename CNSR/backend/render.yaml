# Blueprint do Render (Infrastructure as Code) para deploy contínuo a partir do GitHub.
#
# Como usar:
#   1. Faça push deste projeto (pasta "backend") para um repositório no GitHub.
#   2. No painel do Render, crie um novo "Blueprint" apontando para o repositório.
#      - Se este arquivo não estiver na raiz do repositório, defina o "Root Directory"
#        para a pasta "backend" ao importar o Blueprint (ou ajuste os caminhos abaixo).
#   3. O Render provisiona automaticamente o banco PostgreSQL e o serviço web,
#      injetando DATABASE_URL e gerando um JWT_SECRET como variáveis de ambiente
#      de produção (nenhuma credencial fica exposta no repositório).
#   4. Cada novo push na branch configurada dispara um novo deploy automaticamente
#      (deploy contínuo).

databases:
  - name: cnsr-db
    plan: free
    databaseName: cnsr
    user: cnsr

services:
  - type: web
    name: cnsr-backend
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cnsr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
